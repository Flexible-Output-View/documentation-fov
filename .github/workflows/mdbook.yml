name: Deploy GitHub Pages
on:
  push:
    branches: ["main", "md-book"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.5.4
      EMBEDIFY_VERSION: 0.2.13
      CALLOUTS_VERSION: 0.3.0
      LINKCHECK_VERSION: 0.7.7
    steps:
      - name: Checkout site source
        uses: actions/checkout@v7

      - name: Download mdBook and Preprocessors
        run: |
          set -x
          # Download and extract mdBook v0.5.4
          wget https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz
          tar xzf mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz
          chmod +x mdbook

          # Download and extract mdbook-embedify
          wget https://github.com/MR-Addict/mdbook-embedify/releases/download/${EMBEDIFY_VERSION}/mdbook-embedify-${EMBEDIFY_VERSION}-x86_64-unknown-linux-gnu.zip
          unzip mdbook-embedify-${EMBEDIFY_VERSION}-x86_64-unknown-linux-gnu.zip
          mv mdbook-embedify-${EMBEDIFY_VERSION}-x86_64-unknown-linux-gnu/mdbook-embedify .
          chmod +x mdbook-embedify

          # Download and extract mdbook-linkcheck
          wget https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v${LINKCHECK_VERSION}/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip
          unzip mdbook-linkcheck.x86_64-unknown-linux-gnu.zip -x README.md LICENSE
          chmod +x mdbook-linkcheck

      - name: Install frozen mdbook-callouts via Cargo
        run: |
          cargo install mdbook-callouts --version ${CALLOUTS_VERSION}

      - name: Generate pages
        run: |
          export PATH=$PATH:~/.cargo/bin:.
          ./mdbook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: book/

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
